name: Generate PyPI Index

on:
  repository_dispatch:
    types: [rebuild-index]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: generate-index
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror wheels and generate index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRACTALYZE_REPOS_READ_TOKEN: ${{ secrets.FRACTALYZE_REPOS_READ_TOKEN }}
        run: python3 generate_index.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
